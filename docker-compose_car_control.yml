version: '3.7'

services:
  car:
    image: ghcr.io/otischung/pros_ai_image:latest
    env_file:
      - .env
    volumes:
      - ./src:/workspaces/src:ro
      - ./logs:/workspaces/logs
      - ./car_control_for_docker_compose.sh:/workspaces/car_control_for_docker_compose.sh
    environment:
      - PROS_TASK_LOG_PATH=/workspaces/logs/pros_task_debug.log
    networks:
      - my_bridge_network
    ports:
      - "9090:9090"
    command: ./car_control_for_docker_compose.sh

networks:
  my_bridge_network:
    driver: bridge
